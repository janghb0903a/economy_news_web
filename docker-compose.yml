services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    command: uvicorn app.main:app --host 127.0.0.1 --port 8000

  frontend:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 127.0.0.1"
